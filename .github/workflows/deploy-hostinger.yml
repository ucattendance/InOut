name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ftp_server_dir:
        description: 'Remote folder (leave empty = domains/inout.urbancode.tech/public_html/)'
        required: false
        default: ''

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://api.inout.urbancode.tech

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "::error::Missing secret FTP_SERVER (Hostinger SSH IP, e.g. 93.127.208.197)"; missing=1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "::error::Missing secret FTP_USERNAME (Hostinger SSH username)"; missing=1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "::error::Missing secret FTP_PASSWORD (Hostinger SSH password)"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "Deploy server credentials are set."

      - name: Resolve upload directory
        id: ftpdir
        run: |
          dir="${{ github.event.inputs.ftp_server_dir }}"
          if [ -z "$dir" ]; then
            dir="${{ secrets.FTP_SERVER_DIR }}"
          fi
          if [ -z "$dir" ]; then
            dir="domains/inout.urbancode.tech/public_html/"
          fi
          case "$dir" in
            */) ;;
            *) dir="$dir/" ;;
          esac
          echo "Using remote server-dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Hostinger shared hosting: use SFTP over SSH (port 65002), not plain FTP port 21.
      - name: Deploy to Hostinger (SFTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: 65002
          log-level: verbose
          local-dir: ./build/
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify live deploy check page
        continue-on-error: true
        run: |
          sleep 30
          html=$(curl -fsS "https://inout.urbancode.tech/deploy-check.html" || true)
          echo "$html"
          if echo "$html" | grep -q "v2026.08.17-linode"; then
            echo "Live site updated successfully."
          else
            echo "::warning::Upload finished but live site still shows an old build."
            echo "::warning::Check FTP_SERVER_DIR = domains/inout.urbancode.tech/public_html/"
          fi
