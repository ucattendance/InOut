name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://api.inout.urbancode.tech

      - name: Validate FTP secrets
        run: |
          missing=0
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "::error::Missing secret FTP_SERVER — GitHub → Settings → Secrets → Actions"; missing=1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "::error::Missing secret FTP_USERNAME"; missing=1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "::error::Missing secret FTP_PASSWORD"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Resolve FTP upload directory
        id: ftpdir
        run: |
          dir="${{ secrets.FTP_SERVER_DIR }}"
          # Hostinger shared hosting: site files live under the domain folder,
          # not the account root /public_html/ (uploads there won't update inout.urbancode.tech).
          if [ -z "$dir" ] || [ "$dir" = "/public_html" ] || [ "$dir" = "/public_html/" ]; then
            dir="/domains/inout.urbancode.tech/public_html/"
          fi
          case "$dir" in
            */) ;;
            *) dir="$dir/" ;;
          esac
          echo "Using FTP server-dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          log-level: verbose
          local-dir: ./build/
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify live deploy check page
        continue-on-error: true
        run: |
          sleep 30
          html=$(curl -fsS "https://inout.urbancode.tech/deploy-check.html" || true)
          echo "$html"
          if echo "$html" | grep -q "v2026.08.17-linode"; then
            echo "Live site updated successfully."
          else
            echo "::warning::Deploy uploaded but live site still shows an old build."
            echo "::warning::Set GitHub secret FTP_SERVER_DIR to /domains/inout.urbancode.tech/public_html/"
            echo "::warning::Or upload hostinger-build-linode.zip manually via Hostinger File Manager."
          fi
