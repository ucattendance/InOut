name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ftp_server_dir:
        description: 'Remote folder override (leave empty = auto-detect)'
        required: false
        default: ''

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://api.inout.urbancode.tech

      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "::error::Missing FTP_SERVER (Hostinger FTP IP, e.g. 93.127.208.197)"; missing=1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "::error::Missing FTP_USERNAME (e.g. u736600761.inout.urbancode.tech)"; missing=1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "::error::Missing FTP_PASSWORD"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "Deploy credentials are set."

      - name: Probe FTP and resolve upload directory
        id: ftpdir
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Strip accidental protocol prefix from secret
          SERVER="${FTP_SERVER#ftp://}"
          SERVER="${SERVER#ftps://}"
          SERVER="${SERVER%%/*}"

          override="${{ github.event.inputs.ftp_server_dir }}"
          if [ -z "$override" ]; then
            override="${{ secrets.FTP_SERVER_DIR }}"
          fi

          probe() {
            local path="$1"
            lftp -c "
              set ftp:ssl-allow no;
              set ssl:verify-certificate no;
              set net:timeout 20;
              open -u '${FTP_USERNAME}','${FTP_PASSWORD}' -p 21 ${SERVER};
              cd ${path};
              ls;
            " 2>/dev/null || true
          }

          echo "::group::FTP root listing"
          ROOT_LIST=$(probe "/")
          echo "$ROOT_LIST"
          echo "::endgroup::"

          echo "::group::FTP public_html listing"
          PUB_LIST=$(probe "/public_html")
          echo "$PUB_LIST"
          echo "::endgroup::"

          echo "::group::FTP domains/inout.urbancode.tech/public_html listing"
          DOM_LIST=$(probe "/domains/inout.urbancode.tech/public_html")
          echo "$DOM_LIST"
          echo "::endgroup::"

          pick=""
          if [ -n "$override" ] && [ "$override" != "/" ]; then
            pick="${override#/}"
            pick="${pick%/}/"
          elif echo "$ROOT_LIST" | grep -Eq '(^|[[:space:]])(index\.html|deploy-check\.html|static)([[:space:]]|$)'; then
            # FTP home is already the live web root
            pick="./"
          elif echo "$PUB_LIST" | grep -Eq '(^|[[:space:]])(index\.html|deploy-check\.html|static)([[:space:]]|$)'; then
            pick="public_html/"
          elif echo "$DOM_LIST" | grep -Eq '(^|[[:space:]])(index\.html|deploy-check\.html|static)([[:space:]]|$)'; then
            pick="domains/inout.urbancode.tech/public_html/"
          elif echo "$ROOT_LIST" | grep -q 'public_html'; then
            pick="public_html/"
          else
            echo "::error::Could not find live web root on FTP. Check File Manager path and FTP account."
            exit 1
          fi

          # SamKirkland expects relative server-dir without leading slash for most hosts
          if [ "$pick" = "./" ]; then
            pick="./"
          fi

          echo "Using remote server-dir: $pick"
          echo "dir=$pick" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftpdir.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          log-level: verbose
          local-dir: ./build/
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify live deploy check page
        run: |
          sleep 45
          html=$(curl -fsS "https://inout.urbancode.tech/deploy-check.html" || true)
          echo "$html"
          if echo "$html" | grep -q "v2026.09.15-payslip"; then
            echo "Live site updated successfully."
          else
            echo "::error::Upload finished but https://inout.urbancode.tech still shows an old build (Last-Modified not updated)."
            echo "::error::Open Hostinger File Manager → public_html → check deploy-check.html date/version."
            echo "::error::Also delete GitHub secret FTP_SERVER_DIR if it points to a wrong folder."
            exit 1
          fi
